# Continuous integration: every push and pull request must pass all of these
# before anything is published or deployed (see cd.yml).
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install ruff==0.17.0
      - run: ruff check .

  test:
    name: Tests on PostgreSQL, Redis and RabbitMQ
    needs: lint
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: cq
          POSTGRES_PASSWORD: cq
          POSTGRES_DB: cq_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U cq" --health-interval 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-retries 10
      rabbitmq:
        image: rabbitmq:3.13-alpine
        ports: ["5672:5672"]
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping" --health-interval 5s --health-retries 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Every test runs on SQLite and PostgreSQL; plus Redis cache and RabbitMQ queue tests
        env:
          CQ_TEST_DATABASE_URL: postgresql://cq:cq@localhost:5432/cq_test
          CQ_TEST_REDIS_URL: redis://localhost:6379/0
          CQ_TEST_RABBITMQ_URL: amqp://guest:guest@localhost:5672/%2F
        run: pytest --cov --cov-report=term-missing --cov-fail-under=90

  simulation:
    name: Waitlist auto-fill must beat the baseline
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements.txt
      - run: python scripts/simulate.py --weeks 6 --out /tmp/sim.json --require-improvement
      - name: Assistant accuracy (keyword rules; the LLM run needs a live gateway, see README)
        run: python scripts/eval_assistant.py --rules-only --min-accuracy 0.55 --out /tmp/assistant_eval.json
      - name: Note check (rules catch their mistake types, no clean note flagged)
        run: python scripts/eval_notes.py --rules-only --min-rules-recall 0.95 --out /tmp/note_check_eval.json
      - name: Summary guard (basic summaries, every tampered number rejected)
        run: python scripts/eval_summary.py --basic-only --out /tmp/summary_eval.json

  frontend:
    name: React app type-checks and builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: frontend
      - run: npm run build
        working-directory: frontend

  docker:
    name: Docker image builds and serves traffic
    needs: [lint, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build
        run: docker build --build-arg GIT_SHA=${{ github.sha }} -t carequeue:ci .
      - name: Start the container
        # A throwaway password for the sample accounts, only for this CI container.
        run: docker run -d --name carequeue -p 8000:8000 -e CQ_DEMO_PASSWORD=ci-smoke-${{ github.run_id }} carequeue:ci
      - name: Wait for /api/health and check the build commit
        run: |
          for i in $(seq 1 30); do
            if body=$(curl -fsS http://localhost:8000/api/health); then
              echo "$body"
              echo "$body" | python3 -c "import json,sys; assert json.load(sys.stdin)['commit'] == '${{ github.sha }}'"
              exit 0
            fi
            sleep 2
          done
          echo "container never became healthy"; exit 1
      - name: Smoke test the UI and API
        run: |
          curl -fsS http://localhost:8000/ | grep -q '<div id="root">'
          curl -fsS http://localhost:8000/api/providers
          # Signed out, the portals must refuse.
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8000/api/me/overview)" = 401
          # The demo shortcut is off in a real deployment.
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST http://localhost:8000/api/auth/demo \
            -H 'content-type: application/json' -d '{"role":"patient"}')" = 403
          # Sign in to the sample patient and doctor accounts (the session lives in a cookie).
          curl -fsS -c patient.txt -X POST http://localhost:8000/api/auth/login -H 'content-type: application/json' \
            -d '{"email":"harper.lopez@demo.carequeue","password":"ci-smoke-${{ github.run_id }}","role":"patient"}'
          curl -fsS -b patient.txt http://localhost:8000/api/me/overview
          curl -fsS -b patient.txt -X POST http://localhost:8000/api/me/assistant -H 'content-type: application/json' \
            -d '{"text":"skin doctor next week"}'
          curl -fsS -c doctor.txt -X POST http://localhost:8000/api/auth/login -H 'content-type: application/json' \
            -d '{"email":"maya.patel@demo.carequeue","password":"ci-smoke-${{ github.run_id }}","role":"doctor"}'
          curl -fsS -b doctor.txt http://localhost:8000/api/doctor/today
          curl -fsS -b doctor.txt http://localhost:8000/api/doctor/metrics
      - name: Make sure no secrets were baked into the image
        run: |
          if docker run --rm --entrypoint sh carequeue:ci -c 'ls -a /app' | grep -qx '.env'; then
            echo ".env found in image"; exit 1
          fi
      - name: Container logs
        if: always()
        run: docker logs carequeue
