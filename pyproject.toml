[project]
name = "carequeue"
version = "1.0.0"
description = "Clinic scheduling with waitlist auto-fill: FastAPI, PostgreSQL, Redis, RabbitMQ and a React UI"
requires-python = ">=3.12"

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["frontend"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["B008", "SIM105"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning:starlette.*"]

[tool.coverage.run]
source = ["carequeue"]
omit = ["carequeue/worker.py"]
